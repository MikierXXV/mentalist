name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no se cancelan los que ya están en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir
        # `base` de Vite debe coincidir con la ruta del repositorio en Pages.
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # `enablement` intenta activar Pages la primera vez. Solo funciona si el
      # repositorio permite escritura al GITHUB_TOKEN (Settings → Actions →
      # General → Workflow permissions); si no, hay que activar Pages a mano una
      # vez en Settings → Pages y a partir de ahí este paso lo encuentra ya hecho.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
